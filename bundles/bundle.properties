# Teams
team.green.name = Veridis

# Planets
planet.masatomo.name = Masatomo

#Sectors
sector.masatomo-commencement.name = Commencement
sector.masatomo-commencement.description = The first sector of Masatomo. Gather resources, defend against invading forces and begin researching technology.

sector.masatomo-march.name = March 
sector.masatomo-march.description = This sector contains sources of sulfur, a vital resource for production in this planet.\nObtain this resource and use it to produce ferronickel, and destroy the enemy base in the area.

#Sector Objectives
masatomo.cm.mine = Move to the ore node and click to mine [#b3645f]Hematite[].
masatomo.cm.drill = Open the :tree: tech tree.\nResearch the [accent]hydraulic drill[] and [accent]shielded conveyor[].\nPlace a [accent]hydraulic drill[] on the hematite ore.
masatomo.cm.conv = Link the hydraulic drill to the core with [accent]shielded conveyors[].\nExpand the mining setup to obtain 100 hematite
masatomo.cm.nickel = [#ba7750]Nickel[] is another important resource.\nSet up hydraulic drills to mine nickel.\nObtain 100 [#ba7750]nickel[]
masatomo.cm.generator = Research the [accent]thermocouple generator[] and place one on the cracked basalt tiles.\nThis will be your first source of [accent]power[]
masatomo.cm.pulverizer = Research and place a [accent]pulverizer[] against the red walls.\nThis will automatically produce [#fff4d7]quartz[]. 
masatomo.cm.powerpole = The pulverizer needs [accent]power[] to function.\nResearch and place a [#96fbff]power pole[] to connect the thermocouple generator and the pulverizer.
masatomo.cm.siliconprepare = Your next objective is to produce [#97a2b1]silicon[].\nObtain 80 quartz in-order to research the [accent]silicon arc dissolver[].
masatomo.cm.siliconbuild = Build a [accent]silicon arc dissolver[] to start producing [#97a2b1]silicon[].\nThe arc dissolver needs [#fff4d7]quartz[] and [accent]power[] to create [#97a2b1]silicon[]
masatomo.cm.arcdissolver = The arc dissolver needs [#fff4d7]quartz[] and [accent]power[] to create [#97a2b1]silicon[].\nObtain 100 silicon.
masatomo.cm.initdefense = Enemy invasion detected.\n:up: Move further up in order to build defenses.
masatomo.cm.buildturret = Research and build [accent]Fragment[] turrets in order to defend against incoming enemies.\nSupply them with hematite or quartz for ammunition.
masatomo.cm.buildwalls = Turrets can be easily destroyed when overwhelmed.\nResearch and build [accent]walls[] in order to defend your turrets from incoming fire.\n[accent]Leaving a gap[] ensures enemies are in direct fire.
masatomo.cm.supply = Enemies incoming.\nSupply your turrets with ammo and prepare for an attack.
masatomo.cm.builddischarge = Fragment turrets are weak against swarms of enemies.\nResearch and build [accent]discharge[] turrets to defend against the upcoming waves.
masatomo.cm.supplyturret = Supply the [accent]Discharge[] turret with nickel.\nPrepare for the incoming waves.

masatomo.march.